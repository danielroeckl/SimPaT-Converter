<canvas id="neural-bg"></canvas>
<script>
(function() {
    var canvas = document.getElementById('neural-bg');
    var ctx = canvas.getContext('2d');
    var nodes = [];
    var NODE_COUNT = 90;
    var MAX_DIST = 220;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for (var i = 0; i < NODE_COUNT; i++) {
        nodes.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.4,
            vy: (Math.random() - 0.5) * 0.4,
            r: Math.random() * 2.8 + 1.4
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#18274a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        nodes.forEach(function(n) {
            n.x += n.vx;
            n.y += n.vy;
            if (n.x < 0 || n.x > canvas.width)  n.vx *= -1;
            if (n.y < 0 || n.y > canvas.height) n.vy *= -1;
        });

        for (var i = 0; i < nodes.length; i++) {
            for (var j = i + 1; j < nodes.length; j++) {
                var dx = nodes[i].x - nodes[j].x;
                var dy = nodes[i].y - nodes[j].y;
                var dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < MAX_DIST) {
                    var alpha = (1 - dist / MAX_DIST) * 0.32;
                    ctx.beginPath();
                    ctx.moveTo(nodes[i].x, nodes[i].y);
                    ctx.lineTo(nodes[j].x, nodes[j].y);
                    ctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
                    ctx.lineWidth = 1.0;
                    ctx.stroke();
                }
            }
        }

        nodes.forEach(function(n) {
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            ctx.fill();
        });

        requestAnimationFrame(draw);
    }
    draw();
})();
</script>

function t(key, vars) {
  let s = (I18N[state.lang] && I18N[state.lang][key]) || I18N.en[key] || key;
  if (vars) Object.keys(vars).forEach(k => { s = s.replace('{' + k + '}', vars[k]); });
  return s;
}

function detectInitialLang() {
  const supported = LANGUAGES.map(l => l.code);
  const nav = (navigator.language || 'en').toLowerCase();
  const short = nav.split('-')[0] === 'pt' && nav.includes('br') ? 'pt' : nav.split('-')[0];
  return supported.includes(short) ? short : 'en';
}

  },
};

function applyTransform(direction, key, value) {
  const t = TRANSFORMS[key];
  if (!t) return value;
  return direction === 'toJson' ? t.toJson(value) : t.toExcel(value);
}

function colLetter(idx1based) {
  let s = '', n = idx1based;
  while (n > 0) { const rem = (n - 1) % 26; s = String.fromCharCode(65 + rem) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

/* ==========================================================================
   KONVERTIERUNG
   ========================================================================== */
function excelToSteps(workbook, extras) {
  const warnings = [];
  let sheetName = SHEET_NAME;
  if (!workbook.Sheets[sheetName]) {
    warnings.push(t('warnSheetNotFound', { sheet: workbook.SheetNames[0] }));
    sheetName = workbook.SheetNames[0];
  }
  const ws = workbook.Sheets[sheetName];
  const get = (row, col) => { const addr = XLSX.utils.encode_cell({ r: row - 1, c: col - 1 }); const cell = ws[addr]; return cell ? cell.v : undefined; };

  const patientInfo = {};
  PATIENT_INFO_MAP.forEach(({ valueRow, jsonKey, transform }) => {
    let v = get(valueRow, 1);
    if (transform) v = applyTransform('toJson', transform, v);
    patientInfo[jsonKey] = v === undefined ? '' : v;
  });

  const steps = [];
  let emptyStreak = 0;
  const nameRowDef = ROW_MAP.find(r => r.key === '_name');
  for (let col = FIRST_STEP_COL; col < FIRST_STEP_COL + MAX_STEP_COLS; col++) {
    const name = get(nameRowDef.row, col);
    if (name === undefined || String(name).trim() === '') {
      emptyStreak++;
      if (emptyStreak >= 2) break;
      continue;
    }
    emptyStreak = 0;

    const ageNum = Number(patientInfo.age);
    const defaultAgeGroup = Number.isFinite(ageNum) && ageNum < 18 ? 'pediatric' : 'adult';

    const variables = {
      ...patientInfo,
      firstname: extras.firstname || '',
      surname: extras.surname || '',
      age_group: extras.age_group || defaultAgeGroup,
      sendCO: !!extras.sendCO,
    };
    const meta = {};
    ROW_MAP.forEach(def => {
      if (def.calc) return;
      let v = get(def.row, col);
      if (v === undefined) v = null;
      if (def.transform) v = applyTransform('toJson', def.transform, v);
      if (def.meta) { if (def.key !== '_name') meta[def.key] = v; }
      else { variables[def.key] = v; }
    });
    steps.push({ _name: String(name), ...meta, variables });
  }
  return { steps, patientInfo, warnings };
}

/**
 * Nutzt ExcelJS statt SheetJS, weil die freie SheetJS-Version (Community
 * Edition) das SCHREIBEN von Excel-Datenvalidierungen (Dropdowns) nicht
 * unterstützt — nur ExcelJS kann das im Browser ohne Server.
 * Rückgabe: { buffer, warnings } — buffer direkt als .xlsx speicherbar.
 */
async function stepsToWorkbook(steps) {
  const warnings = [];
  if (!steps.length) throw new Error(t('errNoStepsToExport'));

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(SHEET_NAME);
  const cell = (row, col) => ws.getCell(row, col);
  const setCell = (row, col, value, isFormula) => {
    if (value === undefined || value === null || value === '') return;
    cell(row, col).value = isFormula ? { formula: String(value).replace(/^=/, '') } : value;
  };

  const first = steps[0].variables || {};
  PATIENT_INFO_MAP.forEach(({ valueRow, jsonKey, transform }) => {
    let v = first[jsonKey];
    if (transform) v = applyTransform('toExcel', transform, v);
    setCell(valueRow, 1, v);
  });
  steps.forEach((s, i) => {
    PATIENT_INFO_MAP.forEach(({ jsonKey }) => {
      if (s.variables && s.variables[jsonKey] !== first[jsonKey]) {
        warnings.push(t('warnPatientMismatch', { step: i + 1, name: s._name, key: jsonKey }));
      }
    });
  });

  CALC_PATIENT_ROWS.forEach(r => {
    setCell(r.labelRow, 1, r.label);
    setCell(r.formulaRow, 1, r.formula, true);
  });

  // Original-Template-Labels: IMMER die festen Excel-Begriffe schreiben (nie übersetzt),
  // damit die exportierte Datei unabhängig von der Tool-Sprache wie das Original aussieht.
  ROW_MAP.forEach(def => setCell(def.row, 3, def.label));
  PATIENT_INFO_MAP.forEach(({ valueRow, label }) => setCell(valueRow - 1, 1, label));
  SECTION_LABELS.forEach(s => setCell(s.row, s.col, s.label));

  steps.forEach((step, i) => {
    const col = FIRST_STEP_COL + i;
    const letter = colLetter(col);
    const variables = step.variables || {};
    ROW_MAP.forEach(def => {
      if (def.key === '_name') { setCell(def.row, col, step._name); return; }
      if (def.calc) { setCell(def.row, col, def.formula(letter), true); return; }
      if (def.meta) { setCell(def.row, col, step[def.key]); return; }
      let v = variables[def.key];
      if (def.transform) v = applyTransform('toExcel', def.transform, v);
      setCell(def.row, col, v);
    });
  });

  SECTION_LABELS.forEach(s => {
    ws.mergeCells(s.merge.r + 1, s.merge.c + 1, s.merge.r + s.merge.rSpan, s.merge.c + 1);
  });

  const lastCol = FIRST_STEP_COL + steps.length - 1;

  // Gender-/Control-options-Dropdown: vollständig bekannt -> strikt (wie Original).
  cell(12, 1).dataValidation = {
    type: 'list', allowBlank: true, showErrorMessage: true,
    formulae: [`"${GENDER_OPTIONS.join(',')}"`],
  };
  const curveSheet = (name, values) => {
    const sh = wb.addWorksheet(name);
    values.forEach((v, idx) => { sh.getCell(idx + 1, 1).value = v; });
    return sh;
  };
  curveSheet('ABP curves', ABP_CURVES);
  curveSheet('TPTD curves', TPTD_CURVES);
  curveSheet('PAC curves', PAC_CURVES);

  for (let col = FIRST_STEP_COL; col <= lastCol; col++) {
    cell(35, col).dataValidation = {
      type: 'list', allowBlank: true, showErrorMessage: true,
      formulae: [`"${VENT_CONTROL_OPTIONS.join(',')}"`],
    };
    // HR/TD/PAC curve: NICHT strikt — Liste ist unvollständig (siehe Konstanten oben),
    // freie Texteingabe soll weiterhin möglich sein.
    cell(24, col).dataValidation = {
      type: 'list', allowBlank: true, showErrorMessage: false,
      formulae: [`'ABP curves'!$A$1:$A$${ABP_CURVES.length}`],
    };
    cell(31, col).dataValidation = {
      type: 'list', allowBlank: true, showErrorMessage: false,
      formulae: [`'TPTD curves'!$A$1:$A$${TPTD_CURVES.length}`],
    };
    cell(51, col).dataValidation = {
      type: 'list', allowBlank: true, showErrorMessage: false,
      formulae: [`'PAC curves'!$A$1:$A$${PAC_CURVES.length}`],
    };
  }

  ws.columns = [{ width: 22 }, { width: 4 }, { width: 20 }].concat(
    Array(steps.length).fill({ width: 16 }),
  );

  warnings.push(t('warnCurveListIncomplete'));

  const buffer = await wb.xlsx.writeBuffer();
  return { buffer, warnings };
}

/* ==========================================================================
   STATE
   ========================================================================== */
const state = {
  lang: detectInitialLang(),
  e2j: { workbook: null, filename: '', patientInfo: null, lastSteps: null },
  j2e: { steps: null, filename: '' },
};

/* ==========================================================================
   UI WIRING
   ========================================================================== */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

function renderMsgBox(containerId, type, title, items) {
  const container = document.getElementById(containerId);
  if (!items || !items.length) { container.innerHTML = ''; return; }
  container.innerHTML = `<div class="msg-box ${type}"><strong>${title}</strong><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul></div>`;
}

function renderStepsPreview(containerId, steps) {
  const container = document.getElementById(containerId);
  if (!steps || !steps.length) { container.innerHTML = ''; return; }
  const cols = ['_name', 'hr', 'sap', 'dap', 'gedi', 'peep', 'fio2', 'papCurve'];
  const headers = [t('colName'), 'hr', 'sap', 'dap', 'gedi', 'peep', 'fio2', 'papCurve'];
  let html = '<div class="preview-wrap"><table class="preview"><thead><tr><th>#</th>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
  steps.forEach((s, i) => {
    const v = s.variables || {};
    html += `<tr><td>${i + 1}</td><td>${s._name}</td>` + cols.slice(1).map(c => `<td>${v[c] !== undefined && v[c] !== null ? v[c] : ''}</td>`).join('') + '</tr>';
  });
  html += '</tbody></table></div>';
  container.innerHTML = html;
}

function downloadJSON(steps, filename) {
  const blob = new Blob([JSON.stringify(steps, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderMappingTable() {
  const rows = ROW_MAP.map(r => `<tr><td>${t('mappingRowPrefix')} ${r.row}</td><td>${r.label}</td><td>${r.key || `<em>${t('mappingFormulaNote')}</em>`}</td><td>${r.meta ? t('mappingTypeMeta') : r.calc ? t('mappingTypeCalc') : t('mappingTypeVariables')}</td></tr>`).join('');
  document.getElementById('mapping-table').innerHTML =
    `<thead><tr><th>${t('mappingColExcel')}</th><th>${t('mappingColLabel')}</th><th>${t('mappingColKey')}</th><th>${t('mappingColType')}</th></tr></thead><tbody>${rows}</tbody>`;
}

function renderPatientSummary() {
  const el = document.getElementById('patient-summary');
  if (!state.e2j.patientInfo) { el.textContent = ''; return; }
  const p = state.e2j.patientInfo;
  el.textContent = `${t('patientSummaryPrefix')} ${t('patientWeight')} ${p.weight || '–'}, ${t('patientAge')} ${p.age || '–'}, ${t('patientGender')} ${p.gender || '–'}, ${t('patientHeight')} ${p.height || '–'}`;
}

function renderE2jChip() {
  const chip = document.getElementById('chip-e2j');
  if (!state.e2j.workbook) { chip.innerHTML = ''; return; }
  chip.innerHTML = `<div class="file-chip"><span class="dot"></span>${state.e2j.filenameDisplay}<button id="chip-e2j-clear">✕</button></div>`;
  document.getElementById('chip-e2j-clear').addEventListener('click', resetE2j);
}

function renderJ2eChip() {
  const chip = document.getElementById('chip-j2e');
  if (!state.j2e.steps) { chip.innerHTML = ''; return; }
  chip.innerHTML = `<div class="file-chip"><span class="dot"></span>${state.j2e.filenameDisplay} — ${t('fileChipSteps', { n: state.j2e.steps.length })}<button id="chip-j2e-clear">✕</button></div>`;
  document.getElementById('chip-j2e-clear').addEventListener('click', resetJ2e);
}

/* Alle statischen Texte (data-i18n) + dynamische Bereiche neu rendern */
function applyLanguage() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  renderMappingTable();
  renderPatientSummary();
  renderE2jChip();
  renderJ2eChip();
  if (state.e2j.lastSteps) renderStepsPreview('preview-e2j', state.e2j.lastSteps);
  if (state.j2e.steps) renderStepsPreview('preview-j2e', state.j2e.steps);
  // Meldungsboxen (Fehler/Warnungen/Erfolg) werden beim Sprachwechsel geleert,
  // da sie an die zuletzt ausgeführte Aktion gebunden sind.
  document.getElementById('msgs-e2j').innerHTML = '';
  document.getElementById('msgs-j2e').innerHTML = '';
}

function initLangSelect() {
  const select = document.getElementById('lang-select');
  select.innerHTML = LANGUAGES.map(l => `<option value="${l.code}">${l.name}</option>`).join('');
  select.value = state.lang;
  select.addEventListener('change', () => {
    state.lang = select.value;
    applyLanguage();
  });
}

/* ---- Excel -> JSON ---- */
const dzE2j = document.getElementById('dz-e2j');
const fileE2j = document.getElementById('file-e2j');

function handleE2jFile(file) {
  if (!file) return;
  const displayName = file.name;
  const baseFilename = file.name.replace(/\.(xlsx|xls)$/i, '');
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array', cellFormula: false });
      state.e2j.workbook = workbook;
      state.e2j.filename = baseFilename;
      state.e2j.filenameDisplay = displayName;
      renderE2jChip();
      document.getElementById('form-e2j').style.display = 'block';

      const { patientInfo } = excelToSteps(workbook, {});
      state.e2j.patientInfo = patientInfo;
      renderPatientSummary();
      renderMsgBox('msgs-e2j', 'error', '', []);
    } catch (err) {
      renderMsgBox('msgs-e2j', 'error', t('msgErrorReadExcel'), [err.message]);
    }
  };
  reader.readAsArrayBuffer(file);
}

dzE2j.addEventListener('click', () => fileE2j.click());
fileE2j.addEventListener('change', e => handleE2jFile(e.target.files[0]));
['dragover', 'dragenter'].forEach(evt => dzE2j.addEventListener(evt, e => { e.preventDefault(); dzE2j.classList.add('drag-over'); }));
['dragleave', 'drop'].forEach(evt => dzE2j.addEventListener(evt, e => { e.preventDefault(); dzE2j.classList.remove('drag-over'); }));
dzE2j.addEventListener('drop', e => handleE2jFile(e.dataTransfer.files[0]));

function resetE2j() {
  state.e2j = { workbook: null, filename: '', patientInfo: null, lastSteps: null };
  fileE2j.value = '';
  document.getElementById('chip-e2j').innerHTML = '';
  document.getElementById('form-e2j').style.display = 'none';
  document.getElementById('preview-e2j').innerHTML = '';
  document.getElementById('msgs-e2j').innerHTML = '';
}
document.getElementById('btn-reset-e2j').addEventListener('click', resetE2j);

document.getElementById('btn-convert-e2j').addEventListener('click', () => {
  if (!state.e2j.workbook) return;
  const extras = {
    firstname: document.getElementById('in-firstname').value.trim(),
    surname: document.getElementById('in-surname').value.trim(),
    age_group: document.getElementById('in-agegroup').value,
    sendCO: document.getElementById('in-sendco').checked,
  };
  const errs = [];
  if (!extras.firstname) errs.push(t('errFirstnameMissing'));
  if (!extras.surname) errs.push(t('errSurnameMissing'));
  if (errs.length) { renderMsgBox('msgs-e2j', 'error', t('msgPleaseComplete'), errs); return; }

  const { steps, warnings } = excelToSteps(state.e2j.workbook, extras);
  if (!steps.length) { renderMsgBox('msgs-e2j', 'error', t('msgNoStepsFound'), [t('msgNoStepsFoundDetail')]); return; }
  state.e2j.lastSteps = steps;
  renderMsgBox('msgs-e2j', 'warn', t('msgHints'), warnings);
  renderMsgBox('msgs-e2j', 'success', t('msgConvertedSuccess', { n: steps.length }), []);
  renderStepsPreview('preview-e2j', steps);
  downloadJSON(steps, `${state.e2j.filename || 'simpat-case'}.json`);
});

/* ---- JSON -> Excel ---- */
const dzJ2e = document.getElementById('dz-j2e');
const fileJ2e = document.getElementById('file-j2e');

function handleJ2eFile(file) {
  if (!file) return;
  const displayName = file.name;
  const baseFilename = file.name.replace(/\.json$/i, '');
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!Array.isArray(parsed)) throw new Error(t('errJsonMustBeArray'));
      state.j2e.steps = parsed;
      state.j2e.filename = baseFilename;
      state.j2e.filenameDisplay = displayName;
      renderJ2eChip();
      document.getElementById('actions-j2e').style.display = 'flex';
      renderStepsPreview('preview-j2e', state.j2e.steps);
      renderMsgBox('msgs-j2e', 'error', '', []);
    } catch (err) {
      renderMsgBox('msgs-j2e', 'error', t('msgErrorReadJson'), [err.message]);
    }
  };
  reader.readAsText(file);
}

dzJ2e.addEventListener('click', () => fileJ2e.click());
fileJ2e.addEventListener('change', e => handleJ2eFile(e.target.files[0]));
['dragover', 'dragenter'].forEach(evt => dzJ2e.addEventListener(evt, e => { e.preventDefault(); dzJ2e.classList.add('drag-over'); }));
['dragleave', 'drop'].forEach(evt => dzJ2e.addEventListener(evt, e => { e.preventDefault(); dzJ2e.classList.remove('drag-over'); }));
dzJ2e.addEventListener('drop', e => handleJ2eFile(e.dataTransfer.files[0]));

function resetJ2e() {
  state.j2e = { steps: null, filename: '' };
  fileJ2e.value = '';
  document.getElementById('chip-j2e').innerHTML = '';
  document.getElementById('actions-j2e').style.display = 'none';
  document.getElementById('preview-j2e').innerHTML = '';
  document.getElementById('msgs-j2e').innerHTML = '';
}
document.getElementById('btn-reset-j2e').addEventListener('click', resetJ2e);

function downloadArrayBuffer(buffer, filename) {
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('btn-convert-j2e').addEventListener('click', async () => {
  if (!state.j2e.steps) return;
  const btn = document.getElementById('btn-convert-j2e');
  btn.disabled = true;
  try {
    const { buffer, warnings } = await stepsToWorkbook(state.j2e.steps);
    renderMsgBox('msgs-j2e', 'warn', t('msgHints'), warnings);
    renderMsgBox('msgs-j2e', 'success', t('msgExcelCreatedSuccess', { n: state.j2e.steps.length }), []);
    downloadArrayBuffer(buffer, `${state.j2e.filename || 'simpat-case'}.xlsx`);
  } catch (err) {
    renderMsgBox('msgs-j2e', 'error', t('msgErrorCreateExcel'), [err.message]);
  } finally {
    btn.disabled = false;
  }
});

/* ---- Init ---- */
document.getElementById('copyright-year').textContent = new Date().getFullYear();
initLangSelect();
applyLanguage();
</script>
